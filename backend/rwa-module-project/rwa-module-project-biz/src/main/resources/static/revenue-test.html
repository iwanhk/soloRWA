<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收益测试接口</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; text-align: center; }
        .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h2 { margin-top: 0; color: #409eff; border-bottom: 2px solid #409eff; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #666; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        input:focus { outline: none; border-color: #409eff; }
        button { background: #409eff; color: #fff; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; }
        button:hover { background: #66b1ff; }
        button:disabled { background: #a0cfff; cursor: not-allowed; }
        .result { margin-top: 15px; padding: 15px; border-radius: 4px; word-break: break-all; }
        .success { background: #f0f9eb; border: 1px solid #c2e7b0; color: #67c23a; }
        .error { background: #fef0f0; border: 1px solid #fbc4c4; color: #f56c6c; }
        .config { background: #fff3e0; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .config input { margin-top: 5px; }
    </style>
</head>
<body>
    <h1>🧪 收益测试接口</h1>

    <div class="config">
        <div class="form-group">
            <label>API 基础地址</label>
            <input type="text" id="baseUrl" value="http://127.0.0.1:48080/admin-api" placeholder="http://localhost:48080/admin-api">
<!--            <input type="text" id="baseUrl" value="http://portal.solo.com.hk/admin-api/admin-api" placeholder="http://portal.solo.com.hk/admin-api/admin-api">-->
<!--        </div>-->
        </div>
        <div class="form-group">
            <label>Authorization Token</label>
            <input type="text" id="token" placeholder="Bearer xxxx">
        </div>
    </div>

    <!-- 生成项目收益 -->
    <div class="card">
        <h2>1. 生成项目收益</h2>
        <div class="form-group">
            <label>项目ID</label>
            <input type="number" id="gen_projectId" value="1">
        </div>
        <div class="form-group">
            <label>开始日期</label>
            <input type="date" id="gen_startDate">
        </div>
        <div class="form-group">
            <label>结束日期</label>
            <input type="date" id="gen_endDate">
        </div>
        <div class="form-group">
            <label>基础金额(U)</label>
            <input type="number" id="gen_baseAmount" value="1000" step="0.01">
        </div>
        <button onclick="generateRevenue()">生成收益</button>
        <div id="gen_result" class="result" style="display:none;"></div>
    </div>

    <!-- 计算订单收益 -->
    <div class="card">
        <h2>2. 计算订单收益</h2>
        <div class="form-group">
            <label>起始收益ID</label>
            <input type="number" id="calc_startId" value="1">
        </div>
        <div class="form-group">
            <label>结束收益ID</label>
            <input type="number" id="calc_endId" value="10">
        </div>
        <button onclick="calculateOrderIncome()">计算收益</button>
        <div id="calc_result" class="result" style="display:none;"></div>
    </div>

    <!-- 发放收益 -->
    <div class="card">
        <h2>3. 发放收益</h2>
        <div class="form-group">
            <label>起始收益ID</label>
            <input type="number" id="dist_startId" value="1">
        </div>
        <div class="form-group">
            <label>结束收益ID</label>
            <input type="number" id="dist_endId" value="10">
        </div>
        <button onclick="distributeIncome()">发放收益</button>
        <div id="dist_result" class="result" style="display:none;"></div>
    </div>

    <script>
        // 设置默认日期
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 7);
        document.getElementById('gen_startDate').value = yesterday.toISOString().split('T')[0];
        document.getElementById('gen_endDate').value = today.toISOString().split('T')[0];

        function getConfig() {
            return {
                baseUrl: document.getElementById('baseUrl').value.trim(),
                token: document.getElementById('token').value.trim()
            };
        }

        async function apiCall(url, params) {
            const config = getConfig();
            const queryString = new URLSearchParams(params).toString();
            const fullUrl = `${config.baseUrl}${url}?${queryString}`;
            
            const headers = { 'Content-Type': 'application/json' };
            if (config.token) {
                headers['Authorization'] = config.token;
            }
            headers['tenant-id'] = '1';

            const response = await fetch(fullUrl, {
                method: 'POST',
                headers: headers
            });
            return await response.json();
        }

        function showResult(elementId, success, message) {
            const el = document.getElementById(elementId);
            el.style.display = 'block';
            el.className = 'result ' + (success ? 'success' : 'error');
            el.innerHTML = message;
        }

        async function generateRevenue() {
            const params = {
                projectId: document.getElementById('gen_projectId').value,
                startDate: document.getElementById('gen_startDate').value,
                endDate: document.getElementById('gen_endDate').value,
                baseAmount: document.getElementById('gen_baseAmount').value
            };
            
            try {
                const result = await apiCall('/project/revenue/test/generate-revenue', params);
                if (result.code === 0) {
                    showResult('gen_result', true, `✅ 生成成功！收益ID: ${JSON.stringify(result.data)}`);
                } else {
                    showResult('gen_result', false, `❌ 失败: ${result.msg}`);
                }
            } catch (e) {
                showResult('gen_result', false, `❌ 请求错误: ${e.message}`);
            }
        }

        async function calculateOrderIncome() {
            const params = {
                startId: document.getElementById('calc_startId').value,
                endId: document.getElementById('calc_endId').value
            };
            
            try {
                const result = await apiCall('/project/revenue/test/calculate-order-income', params);
                if (result.code === 0) {
                    showResult('calc_result', true, `✅ 计算成功！处理数量: ${result.data}`);
                } else {
                    showResult('calc_result', false, `❌ 失败: ${result.msg}`);
                }
            } catch (e) {
                showResult('calc_result', false, `❌ 请求错误: ${e.message}`);
            }
        }

        async function distributeIncome() {
            const params = {
                startId: document.getElementById('dist_startId').value,
                endId: document.getElementById('dist_endId').value
            };
            
            try {
                const result = await apiCall('/project/revenue/test/distribute-income', params);
                if (result.code === 0) {
                    showResult('dist_result', true, `✅ 发放成功！处理数量: ${result.data}`);
                } else {
                    showResult('dist_result', false, `❌ 失败: ${result.msg}`);
                }
            } catch (e) {
                showResult('dist_result', false, `❌ 请求错误: ${e.message}`);
            }
        }
    </script>
</body>
</html>
